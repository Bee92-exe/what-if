<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b1e" />
    <title>WHAT IF? — The Padma Files</title>
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('./assets/fonts/press-start-2p.ttf') format('truetype');
        font-display: block;
      }
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0b1e;
        /* The letterbox around the 640x360 canvas is part of the look, not a
           bug: a soft vignette so the surrounding area reads as deliberate. */
        background-image: radial-gradient(ellipse at 50% 45%, #1b1f4a 0%, #0d0b1e 70%);
        display: grid;
        place-items: center;
        font-family: 'Press Start 2P', monospace;
        -webkit-font-smoothing: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      /* Phaser's Scale.FIT + CENTER_BOTH already centres the canvas by giving
         it a margin (e.g. margin-top: 218px). If #game ALSO centres it, the
         offsets add up and the whole game sits ~110px too low with a band of
         dead space under it. Keep this box a plain block. */
      #game {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      canvas {
        /* Scale.FIT keeps the whole 640x360 frame visible; these keep the
           pixels crisp at whatever integer-ish scale the window allows. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        box-shadow: 0 0 0 1px #1b1f4a, 0 0 40px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
